name: Banana Claims 26.3 candidate

on:
  push:
    branches: ['port/minecraft-26.3']
  pull_request:
    branches: [main]
    paths:
      - 'Banana Claims Mod/**'
      - '.github/workflows/claims-26-3.yml'
      - '.github/scripts/smoke_claims_26_3.py'

permissions:
  contents: read

concurrency:
  group: claims-26-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Banana Claims Mod
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile and run configured tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain clean build
      - name: Test built JAR on an isolated dedicated server
        run: python3 ../.github/scripts/smoke_claims_26_3.py
      - name: Upload startup-tested candidate (not production approval)
        uses: actions/upload-artifact@v7
        with:
          name: BananaClaims-26.3-startup-tested-candidate
          path: Banana Claims Mod/build/release-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test logs and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BananaClaims-26.3-test-evidence
          path: |
            Banana Claims Mod/build/reports/
            Banana Claims Mod/build/smoke-26.3/*.log
            Banana Claims Mod/build/smoke-26.3/logs/
            Banana Claims Mod/build/smoke-26.3/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
